<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="p" cx="38%" cy="34%" r="70%">
      <stop offset="0" stop-color="#fff1d6"/>
      <stop offset=".45" stop-color="#f3d09a"/>
      <stop offset="1" stop-color="#c98a3c"/>
    </radialGradient>
    <linearGradient id="r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3d09a" stop-opacity=".35"/>
      <stop offset=".55" stop-color="#f3d09a"/>
      <stop offset="1" stop-color="#fff4e0"/>
    </linearGradient>
    <clipPath id="front"><rect x="0" y="33" width="64" height="31"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="15" fill="#07080d"/>
  <!-- back half of the orbit, behind the planet -->
  <ellipse cx="32" cy="33" rx="25" ry="8.5" transform="rotate(-22 32 33)" fill="none" stroke="url(#r)" stroke-width="3.2" opacity=".55"/>
  <!-- the planet, with its night side -->
  <circle cx="31" cy="33" r="13.5" fill="url(#p)"/>
  <path d="M31 19.5a13.5 13.5 0 0 1 0 27a10 13.5 0 0 0 0-27z" fill="#07080d" opacity=".28"/>
  <!-- front half of the orbit, over the planet -->
  <g clip-path="url(#front)" transform="rotate(-22 32 33)">
    <ellipse cx="32" cy="33" rx="25" ry="8.5" fill="none" stroke="url(#r)" stroke-width="3.2"/>
  </g>
  <!-- the spark: a machine coming back to life -->
  <path d="M53 15.5l1.6 4.4 4.4 1.6-4.4 1.6L53 27.5l-1.6-4.4-4.4-1.6 4.4-1.6z" fill="#fff6e6"/>
</svg>
